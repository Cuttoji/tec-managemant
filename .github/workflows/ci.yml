name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build:
    name: Build & type-check (Next.js)
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8
        env:
          MYSQL_ROOT_PASSWORD: rootpassword
          MYSQL_DATABASE:      tec_management
          MYSQL_USER:          appuser
          MYSQL_PASSWORD:      apppassword
        ports:
          - 3306:3306
        options: >-
          --health-cmd "mysqladmin ping -h 127.0.0.1 -uappuser -papppassword --silent"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20.x'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate
        working-directory: frontend

      - name: Run migrations
        run: npx prisma migrate deploy
        working-directory: frontend
        env:
          DATABASE_URL: mysql://appuser:apppassword@127.0.0.1:3306/tec_management

      - name: Type-check
        run: npm run type-check
        working-directory: frontend
        env:
          DATABASE_URL: mysql://appuser:apppassword@127.0.0.1:3306/tec_management
          AUTH_SECRET:  ci-test-secret
          NEXTAUTH_URL: http://localhost:3002

      - name: Build
        run: npm run build
        working-directory: frontend
        env:
          DATABASE_URL:  mysql://appuser:apppassword@127.0.0.1:3306/tec_management
          AUTH_SECRET:   ci-test-secret
          NEXTAUTH_URL:  http://localhost:3002
          DOCKER_BUILD:  "1"

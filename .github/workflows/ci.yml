name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build:
    name: Build & type-check (Next.js)
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER:     appuser
          POSTGRES_PASSWORD: apppassword
          POSTGRES_DB:       repair_tracking_dev
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U appuser -d repair_tracking_dev"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20.x'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci
        working-directory: frontend

      - name: Generate Prisma client
        run: npx prisma generate
        working-directory: frontend

      - name: Run migrations
        run: npx prisma migrate deploy
        working-directory: frontend
        env:
          DATABASE_URL: postgresql://appuser:apppassword@localhost:5432/repair_tracking_dev

      - name: Type-check
        run: npm run type-check
        working-directory: frontend
        env:
          DATABASE_URL: postgresql://appuser:apppassword@localhost:5432/repair_tracking_dev
          AUTH_SECRET:  ci-test-secret
          NEXTAUTH_URL: http://localhost:3002

      - name: Build
        run: npm run build
        working-directory: frontend
        env:
          DATABASE_URL:  postgresql://appuser:apppassword@localhost:5432/repair_tracking_dev
          AUTH_SECRET:   ci-test-secret
          NEXTAUTH_URL:  http://localhost:3002
          DOCKER_BUILD:  "1"
